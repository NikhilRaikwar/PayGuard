[workspace]
resolver = "2"
members = [
  "host",
  "methods"
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
hex = "0.4"
risc0-build = "3.0.5"
risc0-zkvm = "3.0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
